name: Castiq dg-vps-08 staging candidate
run-name: Castiq staging build ${{ inputs.sha }}
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full approved 40-character commit SHA on main
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: castiq-dg-vps-08-staging-candidate
  cancel-in-progress: false
jobs:
  admission:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      config_id: ${{ steps.admit.outputs.config_id }}
    env:
      TARGET_SHA: ${{ inputs.sha }}
      CASTIQ_APP_ORIGIN: ${{ vars.CASTIQ_APP_ORIGIN }}
      CASTIQ_DATA_MODE: ${{ vars.CASTIQ_DATA_MODE }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Validate public profile and exact CI admission
        id: admit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/check-config.mjs --scope=build --target=staging
          CONFIG_ID=$(node --input-type=module -e 'import{createHash}from"node:crypto";import{publicConfigurationNames}from"./scripts/configuration.mjs";console.log(createHash("sha256").update(JSON.stringify(Object.fromEntries([...publicConfigurationNames].sort().map(k=>[k,process.env[k]])))).digest("hex"))')
          node scripts/release-gate.mjs --action build --sha "$TARGET_SHA" --config-id "$CONFIG_ID"
          echo "config_id=$CONFIG_ID" >> "$GITHUB_OUTPUT"
  candidate:
    needs: admission
    runs-on: [self-hosted, Linux, X64, castiq, dg-vps-08, staging, castiq-staging]
    timeout-minutes: 25
    env:
      TARGET_SHA: ${{ inputs.sha }}
      CASTIQ_APP_ORIGIN: ${{ vars.CASTIQ_APP_ORIGIN }}
      CASTIQ_DATA_MODE: ${{ vars.CASTIQ_DATA_MODE }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Build candidate through fixed root-owned boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = dg-vps-08
          test "$(id -un)" = castiq-runner
          test "$RUNNER_NAME" = dg-vps-08-castiq-staging
          python3 - <<'PY'
          import json,os,subprocess,time
          public=['CASTIQ_APP_ORIGIN','CASTIQ_DATA_MODE','NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY','NEXT_PUBLIC_SUPABASE_URL']
          context=['GITHUB_REPOSITORY','GITHUB_REPOSITORY_ID','GITHUB_EVENT_NAME','GITHUB_REF','GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT']
          payload=json.dumps({'token':os.environ['GITHUB_TOKEN'],'configuration':{k:os.environ[k] for k in public},'context':{k:os.environ[k] for k in context}}).encode()
          command=['sudo','-n','/usr/local/libexec/castiq-staging-release','build',os.environ['TARGET_SHA'],os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']]
          for attempt in range(2):
              result=subprocess.run(command,input=payload)
              if result.returncode!=75 or attempt==1: raise SystemExit(result.returncode)
              print('Shared build lock busy; one bounded retry in 10 seconds.',flush=True)
              time.sleep(10)
          PY
