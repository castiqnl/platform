name: Castiq dg-vps-08 staging activate
run-name: Castiq staging activate ${{ inputs.sha }}
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full approved SHA of the existing candidate
        required: true
        type: string
      candidate_id:
        description: Existing candidate ID printed by the build workflow
        required: true
        type: string
      runtime_config_id:
        description: Reviewed root-owned runtime JSON version on dg-vps-08
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: castiq-dg-vps-08-staging-activation
  cancel-in-progress: false
jobs:
  admission:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ inputs.sha }}
      CASTIQ_APP_ORIGIN: ${{ vars.CASTIQ_APP_ORIGIN }}
      CASTIQ_DATA_MODE: ${{ vars.CASTIQ_DATA_MODE }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Validate exact release and CI before environment approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/check-config.mjs --scope=build --target=staging
          CONFIG_ID=$(node --input-type=module -e 'import{createHash}from"node:crypto";import{publicConfigurationNames}from"./scripts/configuration.mjs";console.log(createHash("sha256").update(JSON.stringify(Object.fromEntries([...publicConfigurationNames].sort().map(k=>[k,process.env[k]])))).digest("hex"))')
          node scripts/release-gate.mjs --action activate --sha "$TARGET_SHA" --config-id "$CONFIG_ID"
  activate:
    needs: admission
    environment: castiq-dg-vps-08-staging
    runs-on: [self-hosted, Linux, X64, castiq, dg-vps-08, staging, castiq-staging]
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ inputs.sha }}
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      RUNTIME_CONFIG_ID: ${{ inputs.runtime_config_id }}
      CASTIQ_APP_ORIGIN: ${{ vars.CASTIQ_APP_ORIGIN }}
      CASTIQ_DATA_MODE: ${{ vars.CASTIQ_DATA_MODE }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Activate reviewed app and runtime pair
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = dg-vps-08
          test "$(id -un)" = castiq-runner
          test "$RUNNER_NAME" = dg-vps-08-castiq-staging
          python3 - <<'PY'
          import json,os,subprocess
          public=['CASTIQ_APP_ORIGIN','CASTIQ_DATA_MODE','NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY','NEXT_PUBLIC_SUPABASE_URL']
          context=['GITHUB_REPOSITORY','GITHUB_REPOSITORY_ID','GITHUB_EVENT_NAME','GITHUB_REF','GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT']
          payload=json.dumps({'token':os.environ['GITHUB_TOKEN'],'configuration':{k:os.environ[k] for k in public},'context':{k:os.environ[k] for k in context}}).encode()
          command=['sudo','-n','/usr/local/libexec/castiq-staging-release','activate',os.environ['TARGET_SHA'],os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'],os.environ['CANDIDATE_ID'],os.environ['RUNTIME_CONFIG_ID']]
          raise SystemExit(subprocess.run(command,input=payload).returncode)
          PY
